<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>DeCube</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* The game fills the page (or itch's frame); its UI scales to the height (UICanvas). */
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
      /* Shown while the player data downloads; the game then fades in from black itself. */
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 32px; background: #000; color: #a9a3a4; font: 14px/1.4 monospace; transition: opacity 0.4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading img { width: min(60vw, 640px); }
      #bar { width: min(50vw, 400px); height: 8px; background: #231f20; }
      #fill { width: 0; height: 100%; background: #f2efe9; transition: width 0.2s; }
      #message { min-height: 1.4em; max-width: min(80vw, 640px); text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img src="TemplateData/logo.png" alt="DeCube">
      <div id="bar"><div id="fill"></div></div>
      <div id="message"></div>
    </div>
    <script src="Build/WebDemo.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var message = document.querySelector("#message");

      // GitHub Pages refuses files over 100 MB, so Tools > DeCube > Release splits the data file for it and lists the parts
      // here; they're joined into a blob URL. Everywhere else this stays empty and the data file loads as built.
      var dataParts = [];
      var dataUrl = dataParts.length == 0
        ? Promise.resolve("Build/WebDemo.data.unityweb")
        : Promise.all(dataParts.map((part) => fetch("Build/" + part).then((r) => {
            if (!r.ok) throw new Error("Build/" + part + ": HTTP " + r.status);
            return r.blob();
          }))).then((blobs) => URL.createObjectURL(new Blob(blobs)));

      dataUrl.then((url) => createUnityInstance(canvas, {
        dataUrl: url,
        frameworkUrl: "Build/WebDemo.framework.js.unityweb",
        codeUrl: "Build/WebDemo.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BiteMe Games",
        productName: "DeCube",
        productVersion: "v2026.11.11",
        // The save lives in persistentDataPath; this writes it through to IndexedDB on its own.
        autoSyncPersistentDataPath: true,
        // Keeps the build and the audio bundles (StreamingAssets/Audio, fetched after start) in IndexedDB, checked
        // against the server each load, so a second visit downloads only what changed. A blob URL is new every
        // load, so caching it would only store another copy; its parts are in the browser's HTTP cache.
        cacheControl: (u) => /^blob:/.test(u) ? "no-store"
          : /\.(data|wasm|framework\.js|bundle)(\.unityweb|\.gz|\.br)?$/.test(u) ? "must-revalidate"
          : "no-store",
        // Crisp pixels on high-DPI screens would cost up to 4× the fill rate; the game is pixel art at 1080p anyway.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: (msg, type) => {
          if (type == "error") { message.textContent = msg; loading.classList.remove("done"); }
          else console.warn(msg);
        },
      }, (progress) => {
        fill.style.width = (100 * progress) + "%";
      })).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loading.classList.add("done");
        canvas.focus();
      }).catch((error) => {
        message.textContent = "DeCube couldn't start in this browser: " + error
          + ". A recent Chrome, Edge, Firefox or Safari on a computer works best.";
      });
    </script>
  </body>
</html>
